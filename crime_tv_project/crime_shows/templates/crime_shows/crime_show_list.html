{% extends "crime_shows/base.html" %}
{% block title %}Crime TV Shows{% endblock %}

{% block content %}
<h1>Crime TV Shows</h1>
<ul class="list-group">
    {% for show in crime_shows %}
        <li class="list-group-item">
            <a href="{% url 'crime_show_detail' show.pk %}">{{ show.title }}</a>
        </li>
    {% endfor %}
</ul>
{% endblock %}
