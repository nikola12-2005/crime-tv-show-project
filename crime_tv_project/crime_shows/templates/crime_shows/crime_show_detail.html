<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ crime_show.title }}</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1>{{ crime_show.title }}</h1>
    <p>{{ crime_show.description }}</p>
    <p>Genre: {{ crime_show.genre }}</p>
    <p>Rating: {{ crime_show.rating }}</p>
    <p>Release Date: {{ crime_show.release_date }}</p>
    <img src="{{ crime_show.image.url }}" alt="Image" class="img-fluid">
    <a href="/">Back to Crime Shows</a>
</div>

</body>
</html>
